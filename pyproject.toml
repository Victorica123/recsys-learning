[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-learning"
version = "0.1.0"
description = "生产导向的 MovieLens 推荐系统学习与研究项目"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "torch==2.9.1",
    "pandas==3.0.3",
    "numpy==2.5.1",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "faiss-cpu==1.14.3",
    "streamlit==1.59.2",
    "starlette==1.3.1",
    "uvicorn==0.51.0",
    "gymnasium==1.2.2",
]

[project.optional-dependencies]
# LunarLander 番外需要 Box2D；核心推荐链路与 CPU 测试不依赖它。
lander = [
    "stable-baselines3==2.7.0",
    "gymnasium[box2d]==1.2.2",
    "pillow==12.3.0",
]
dev = ["ruff>=0.6", "coverage>=7.0"]

# ---------------------------------------------------------------------------
# 项目采用扁平 src/ 布局（训练脚本互相 `from config import ...`），而非
# Python 包布局。serve.py / app.py / tests/__init__.py 等在入口处把 src/
# 加入 sys.path。此处不做 setuptools 包化，避免与既有 15+ 处入口约定冲突。
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 保守起步：只拦真错误（未定义名/运行时错误），不因历史风格问题阻断 CI。
select = ["E9", "F821"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
