<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Recommendation：从一次排序到有记忆、有工具、有反馈的决策循环</title>
  <desc id="desc">中心展示推荐代理如何理解目标、读取画像和记忆、规划、调用召回排序与外部信息工具、验证约束并行动；右侧区分代理辅助推荐、代理作为推荐器、代理作为用户模拟器三种范式；底部给出评估维度。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" class="ah"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.blue{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.6}.purple{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.6}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:1.6}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:1.6}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}.neutral{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.2}.core{fill:#ede9fe;stroke:#7c3aed;stroke-width:2.2}
      .t{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#0f172a;font-size:15px}.h{font-size:28px;font-weight:600}.sub{font-size:18px;font-weight:600}.nh{font-size:15px;font-weight:600}.s{font-size:13px;fill:#475569}.xs{font-size:12px;fill:#64748b}.arrow{fill:none;stroke:#475569;stroke-width:1.8;marker-end:url(#a)}.loop{fill:none;stroke:#7c3aed;stroke-width:2.2;marker-end:url(#a)}.feedback{fill:none;stroke:#16a34a;stroke-width:2.2;marker-end:url(#a)}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#a)}.ah{fill:#475569}.line{stroke:#cbd5e1;stroke-width:1}.badge{font-size:12px;font-weight:600;fill:#6d28d9}
      @media(prefers-color-scheme:dark){.bg{fill:#0f172a}.panel{fill:#111827;stroke:#475569}.blue{fill:#0c4a6e;stroke:#38bdf8}.purple{fill:#581c87;stroke:#c084fc}.green{fill:#14532d;stroke:#4ade80}.amber{fill:#78350f;stroke:#fbbf24}.warn{fill:#7c2d12;stroke:#fb923c}.neutral{fill:#1e293b;stroke:#64748b}.core{fill:#4c1d95;stroke:#a78bfa}.t{fill:#f8fafc}.s{fill:#cbd5e1}.xs{fill:#94a3b8}.arrow{stroke:#cbd5e1}.dash{stroke:#94a3b8}.ah{fill:#cbd5e1}.line{stroke:#475569}.badge{fill:#c4b5fd}}
    </style>
  </defs>
  <rect class="bg" width="1280" height="860"/>
  <text class="t h" x="40" y="47">Agentic Recommendation：推荐器从“打一次分”变成“完成一次目标”</text>
  <text class="t s" x="40" y="74">Agent 的最小闭环不是多写一段解释，而是能管理状态、选择工具、承担成本、检查约束，并从轨迹反馈中更新。</text>

  <rect class="panel" x="34" y="98" width="850" height="606" rx="18"/>
  <text class="t sub" x="58" y="132">一次可审计的代理决策轨迹</text>
  <rect class="blue" x="58" y="162" width="176" height="82" rx="12"/>
  <text class="t nh" x="146" y="190" text-anchor="middle">用户目标 / 对话</text>
  <text class="t s" x="146" y="214" text-anchor="middle">“今晚两人看，轻松，90 分钟”</text>
  <rect class="purple" x="282" y="152" width="214" height="102" rx="12"/>
  <text class="t nh" x="389" y="181" text-anchor="middle">理解与状态抽象</text>
  <text class="t s" x="389" y="205" text-anchor="middle">硬约束：时长 / 地区 / 年龄</text>
  <text class="t s" x="389" y="226" text-anchor="middle">软偏好：类型 / 新颖度 / 情绪</text>
  <rect class="neutral" x="544" y="142" width="292" height="122" rx="12"/>
  <text class="t nh" x="690" y="171" text-anchor="middle">画像与记忆</text>
  <text class="t s" x="690" y="195" text-anchor="middle">短期：本轮对话、当前会话、疲劳</text>
  <text class="t s" x="690" y="216" text-anchor="middle">长期：稳定偏好、历史反馈、禁忌</text>
  <text class="t xs" x="690" y="241" text-anchor="middle">记忆必须可过期、可纠错、可删除；不是无限追加文本</text>
  <path class="arrow" d="M234 203H276"/><path class="arrow" d="M496 203H538"/>

  <rect class="core" x="302" y="302" width="250" height="136" rx="18"/>
  <text class="t sub" x="427" y="335" text-anchor="middle">Agent Controller</text>
  <text class="t nh" x="427" y="365" text-anchor="middle">计划：先查什么？是否需要工具？</text>
  <text class="t s" x="427" y="390" text-anchor="middle">动作策略：直接推荐 / 调用 / 追问 / 停止</text>
  <text class="t s" x="427" y="413" text-anchor="middle">成本模型：延迟、token、调用费、用户打扰</text>
  <path class="loop" d="M389 254V280Q389 294 403 302"/>
  <path class="loop" d="M690 264V282Q690 294 676 294H566Q552 294 552 320"/>

  <text class="t badge" x="68" y="307">工具层：每次调用都应有输入、输出、成本和失败兜底</text>
  <rect class="blue" x="58" y="326" width="174" height="72" rx="11"/>
  <text class="t nh" x="145" y="353" text-anchor="middle">召回 / 搜索</text><text class="t s" x="145" y="376" text-anchor="middle">双塔 · I2I · 外部目录</text>
  <rect class="blue" x="58" y="424" width="174" height="72" rx="11"/>
  <text class="t nh" x="145" y="451" text-anchor="middle">精排 / 重排</text><text class="t s" x="145" y="474" text-anchor="middle">DeepFM · 多样性 · 规则</text>
  <rect class="blue" x="58" y="522" width="174" height="72" rx="11"/>
  <text class="t nh" x="145" y="549" text-anchor="middle">知识 / 解释</text><text class="t s" x="145" y="572" text-anchor="middle">内容事实 · 可追溯理由</text>
  <path class="arrow" d="M302 350H238"/><path class="arrow" d="M302 370Q262 370 262 460H238"/><path class="arrow" d="M302 390Q278 390 278 558H238"/>

  <rect class="amber" x="600" y="326" width="236" height="102" rx="12"/>
  <text class="t nh" x="718" y="355" text-anchor="middle">验证器 / 护栏</text>
  <text class="t s" x="718" y="379" text-anchor="middle">候选是否合法？约束是否满足？</text>
  <text class="t s" x="718" y="400" text-anchor="middle">事实能否追溯？成本是否超预算？</text>
  <path class="arrow" d="M552 370H594"/>
  <rect class="green" x="600" y="472" width="236" height="92" rx="12"/>
  <text class="t nh" x="718" y="501" text-anchor="middle">行动</text>
  <text class="t s" x="718" y="525" text-anchor="middle">展示列表 / 解释 / 追问澄清</text>
  <text class="t xs" x="718" y="547" text-anchor="middle">同时记录工具轨迹与 propensity</text>
  <path class="arrow" d="M718 428V466"/>
  <rect class="green" x="302" y="518" width="250" height="86" rx="12"/>
  <text class="t nh" x="427" y="547" text-anchor="middle">用户 / 环境反馈</text>
  <text class="t s" x="427" y="571" text-anchor="middle">接受、跳过、改口、满意度、长期结果</text>
  <path class="feedback" d="M600 518H558"/>
  <path class="feedback" d="M427 518V474Q427 456 445 456H568Q586 456 586 414H600"/>
  <text class="t xs" x="440" y="484">同轮修正：验证失败或用户改口</text>
  <path class="feedback" d="M427 604V648Q427 668 447 668H760Q780 668 780 648V570"/>
  <text class="t xs" x="604" y="687" text-anchor="middle">跨轮更新：反馈进入记忆与评估，不等于立刻改模型参数</text>

  <rect class="panel" x="910" y="98" width="336" height="606" rx="18"/>
  <text class="t sub" x="934" y="132">三种 Agentic 推荐范式</text>
  <rect class="blue" x="934" y="158" width="288" height="118" rx="12"/>
  <text class="t nh" x="1078" y="187" text-anchor="middle">1. Agent-assisted</text>
  <text class="t s" x="1078" y="211" text-anchor="middle">核心排序系统仍负责决策</text>
  <text class="t s" x="1078" y="232" text-anchor="middle">Agent 帮画像、解释、选工具或编排流程</text>
  <text class="t xs" x="1078" y="255" text-anchor="middle">本项目工具门最接近这一层</text>
  <rect class="purple" x="934" y="302" width="288" height="118" rx="12"/>
  <text class="t nh" x="1078" y="331" text-anchor="middle">2. Agent-as-recommender</text>
  <text class="t s" x="1078" y="355" text-anchor="middle">Agent 自己规划、检索、比较并生成列表</text>
  <text class="t s" x="1078" y="376" text-anchor="middle">重点变成轨迹、成本、可控性与失败恢复</text>
  <text class="t xs" x="1078" y="399" text-anchor="middle">不能只测最终 Recall@K</text>
  <rect class="amber" x="934" y="446" width="288" height="118" rx="12"/>
  <text class="t nh" x="1078" y="475" text-anchor="middle">3. Agent-as-user-simulator</text>
  <text class="t s" x="1078" y="499" text-anchor="middle">代理扮演用户产生会话与反馈</text>
  <text class="t s" x="1078" y="520" text-anchor="middle">可做压力测试，但会继承模拟器偏差</text>
  <text class="t xs" x="1078" y="543" text-anchor="middle">必须校准真人行为，不能自证有效</text>
  <rect class="warn" x="934" y="590" width="288" height="86" rx="12"/>
  <text class="t nh" x="1078" y="619" text-anchor="middle">成熟度提醒</text>
  <text class="t s" x="1078" y="643" text-anchor="middle">这是研究分类，不是固定工业标准</text>
  <text class="t s" x="1078" y="664" text-anchor="middle">自主性越高，评估与安全债务越大</text>

  <rect class="panel" x="34" y="730" width="1212" height="104" rx="18"/>
  <text class="t sub" x="58" y="764">评估从“结果分”扩展到“整条轨迹”</text>
  <rect class="neutral" x="58" y="782" width="210" height="34" rx="9"/><text class="t s" x="163" y="804" text-anchor="middle">结果：相关性 / 多样性 / 留存</text>
  <rect class="neutral" x="286" y="782" width="210" height="34" rx="9"/><text class="t s" x="391" y="804" text-anchor="middle">过程：工具选择 / 计划质量</text>
  <rect class="neutral" x="514" y="782" width="210" height="34" rx="9"/><text class="t s" x="619" y="804" text-anchor="middle">成本：延迟 / token / 调用率</text>
  <rect class="neutral" x="742" y="782" width="210" height="34" rx="9"/><text class="t s" x="847" y="804" text-anchor="middle">可信：事实 / 隐私 / 可控性</text>
  <rect class="neutral" x="970" y="782" width="252" height="34" rx="9"/><text class="t s" x="1096" y="804" text-anchor="middle">因果：代理贡献拆分 / 模拟器校准</text>
</svg>
