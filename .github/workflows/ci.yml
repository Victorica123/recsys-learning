name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pandas numpy matplotlib seaborn faiss-cpu streamlit starlette uvicorn ruff coverage

      - name: Syntax check
        run: |
          python -m compileall -q src serve.py app.py feedback_app.py scripts tests research_v2 research_v3

      - name: Lint (fatal errors only)
        run: ruff check --select E9,F821 src serve.py app.py feedback_app.py scripts tests

      - name: Unit tests (CPU, no data / no GPU)
        # `-t .` 让 tests 作为包导入，从而触发 tests/__init__.py 把 src/ 加入
        # sys.path；缺它会漏掉 research_v2 等包的测试并报 import 错误。
        run: python -m unittest discover -t . -s tests -v
